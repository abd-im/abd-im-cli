name: Controlled OpenIM Integration

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPRIVATE: github.com/abd-im/*
  GONOSUMDB: github.com/abd-im/*

jobs:
  openim:
    runs-on: ubuntu-24.04
    environment: openim-integration
    env:
      ABDIM_OPENIM_API_ADDR: ${{ vars.ABDIM_OPENIM_API_ADDR }}
      ABDIM_OPENIM_WS_ADDR: ${{ vars.ABDIM_OPENIM_WS_ADDR }}
      ABDIM_OPENIM_USER_ID: ${{ vars.ABDIM_OPENIM_USER_ID }}
      ABDIM_OPENIM_GROUP_ID: ${{ vars.ABDIM_OPENIM_GROUP_ID }}
      ABDIM_OPENIM_MEMBER_QUERY: ${{ vars.ABDIM_OPENIM_MEMBER_QUERY }}
      ABDIM_OPENIM_CONVERSATION_ID: ${{ vars.ABDIM_OPENIM_CONVERSATION_ID }}
      ABDIM_OPENIM_MESSAGE_ID: ${{ vars.ABDIM_OPENIM_MESSAGE_ID }}
      ABDIM_OPENIM_MESSAGE_QUERY: ${{ vars.ABDIM_OPENIM_MESSAGE_QUERY }}
      ABDIM_OPENIM_AFTER_MESSAGE_ID: ${{ vars.ABDIM_OPENIM_AFTER_MESSAGE_ID }}
      ABDIM_OPENIM_FRIEND_USER_ID: ${{ vars.ABDIM_OPENIM_FRIEND_USER_ID }}
      ABDIM_OPENIM_FRIEND_QUERY: ${{ vars.ABDIM_OPENIM_FRIEND_QUERY }}
      ABDIM_OPENIM_BLACKLIST_USER_ID: ${{ vars.ABDIM_OPENIM_BLACKLIST_USER_ID }}
      ABDIM_OPENIM_GROUP_CREATE_MEMBER_ID: ${{ vars.ABDIM_OPENIM_GROUP_CREATE_MEMBER_ID }}
      ABDIM_OPENIM_MESSAGE_SEND_RECIPIENT_ID: ${{ vars.ABDIM_OPENIM_MESSAGE_SEND_RECIPIENT_ID }}
      ABDIM_OPENIM_PLATFORM_ID: ${{ vars.ABDIM_OPENIM_PLATFORM_ID }}
      ABDIM_OPENIM_TOKEN: ${{ secrets.ABDIM_OPENIM_TOKEN }}
      ABDIM_OPENIM_GROUP_MEMBERSHIP_OWNER_ID: ${{ vars.ABDIM_OPENIM_USER_ID }}
      ABDIM_OPENIM_GROUP_MEMBERSHIP_OWNER_TOKEN: ${{ secrets.ABDIM_OPENIM_TOKEN }}
      ABDIM_OPENIM_GROUP_MEMBERSHIP_MEMBER_ID: ${{ vars.ABDIM_OPENIM_MESSAGE_SEND_RECIPIENT_ID }}
      ABDIM_OPENIM_GROUP_MEMBERSHIP_MEMBER_TOKEN: ${{ secrets.ABDIM_OPENIM_SECONDARY_TOKEN }}
      ABDIM_OPENIM_FRIEND_REQUESTER_ID: ${{ vars.ABDIM_OPENIM_USER_ID }}
      ABDIM_OPENIM_FRIEND_REQUESTER_TOKEN: ${{ secrets.ABDIM_OPENIM_TOKEN }}
      ABDIM_OPENIM_FRIEND_RESPONDER_ID: ${{ vars.ABDIM_OPENIM_MESSAGE_SEND_RECIPIENT_ID }}
      ABDIM_OPENIM_FRIEND_RESPONDER_TOKEN: ${{ secrets.ABDIM_OPENIM_SECONDARY_TOKEN }}
      ABDIM_OPENIM_BLACKLIST_OWNER_ID: ${{ vars.ABDIM_OPENIM_USER_ID }}
      ABDIM_OPENIM_BLACKLIST_OWNER_TOKEN: ${{ secrets.ABDIM_OPENIM_TOKEN }}
      ABDIM_OPENIM_BLACKLIST_TARGET_ID: ${{ vars.ABDIM_OPENIM_MESSAGE_SEND_RECIPIENT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure private module access
        env:
          ABDIM_TOKEN: ${{ secrets.ABDIM_TOKEN }}
        run: |
          if [[ -z "$ABDIM_TOKEN" ]]; then
            echo "::error title=Missing private module token::Configure the repository secret ABDIM_TOKEN with read-only Contents access to the required private ABD IM repositories."
            exit 2
          fi
          git config --global url."https://x-access-token:${ABDIM_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: go mod download
      - name: Validate controlled integration configuration
        run: |
          required=(
            ABDIM_OPENIM_API_ADDR ABDIM_OPENIM_WS_ADDR ABDIM_OPENIM_USER_ID ABDIM_OPENIM_TOKEN
            ABDIM_OPENIM_GROUP_ID ABDIM_OPENIM_MEMBER_QUERY
            ABDIM_OPENIM_CONVERSATION_ID ABDIM_OPENIM_MESSAGE_ID ABDIM_OPENIM_MESSAGE_QUERY ABDIM_OPENIM_AFTER_MESSAGE_ID
            ABDIM_OPENIM_FRIEND_USER_ID ABDIM_OPENIM_FRIEND_QUERY ABDIM_OPENIM_BLACKLIST_USER_ID
            ABDIM_OPENIM_GROUP_CREATE_MEMBER_ID ABDIM_OPENIM_MESSAGE_SEND_RECIPIENT_ID ABDIM_OPENIM_PLATFORM_ID
            ABDIM_OPENIM_GROUP_MEMBERSHIP_OWNER_ID ABDIM_OPENIM_GROUP_MEMBERSHIP_OWNER_TOKEN
            ABDIM_OPENIM_GROUP_MEMBERSHIP_MEMBER_ID ABDIM_OPENIM_GROUP_MEMBERSHIP_MEMBER_TOKEN
            ABDIM_OPENIM_FRIEND_REQUESTER_ID ABDIM_OPENIM_FRIEND_REQUESTER_TOKEN
            ABDIM_OPENIM_FRIEND_RESPONDER_ID ABDIM_OPENIM_FRIEND_RESPONDER_TOKEN
            ABDIM_OPENIM_BLACKLIST_OWNER_ID ABDIM_OPENIM_BLACKLIST_OWNER_TOKEN ABDIM_OPENIM_BLACKLIST_TARGET_ID
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { printf '%s is required\n' "$name" >&2; exit 2; }
          done
      - name: Validate compatibility and typed reads
        run: |
          go test -tags=integration ./tests/compatibility -run '^TestOpenIMServerMatchesSingleCodexCompatibilityMatrix$' -count=1
          go test -tags=integration ./internal/service/profile ./internal/service/conversation ./internal/service/message ./internal/service/group ./internal/service/social -count=1
      - name: Validate typed actions
        run: |
          go test -tags=integration ./internal/capability/group -count=1
          go test -tags=integration ./internal/capability/message -count=1
          go test -tags=integration ./internal/bridge/abdim -run '^TestAdapterMediaUploadIntegration$' -count=1
          go test -tags=integration ./internal/capability/conversation -count=1
          go test -tags=integration ./internal/capability/friend -count=1
          go test -tags=integration ./internal/capability/blacklist -count=1
