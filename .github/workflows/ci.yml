name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/abd-im/*
  GONOSUMDB: github.com/abd-im/*

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure private SDK access
        env:
          SDK_READ_TOKEN: ${{ secrets.ABDIM_SDK_READ_TOKEN }}
        run: |
          if [[ -z "$SDK_READ_TOKEN" ]]; then
            echo "::error title=Missing private SDK token::Configure the repository secret ABDIM_SDK_READ_TOKEN with read-only Contents access to abd-im/abd-im-sdk-core."
            exit 2
          fi
          git config --global url."https://x-access-token:${SDK_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile Unix release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            IFS=/ read -r goos goarch <<<"$target"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/abdim-${goos}-${goarch}" ./cmd/abdim
          done
